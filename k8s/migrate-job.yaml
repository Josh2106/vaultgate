# Run schema migrations before rolling out a new API version (e.g. as an Argo CD PreSync hook).
apiVersion: batch/v1
kind: Job
metadata:
  name: vaultgate-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: ghcr.io/josh2106/vaultgate:0.1.0
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: vaultgate-config }
          env:
            - name: VG_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: vaultgate-secrets, key: database-url }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
