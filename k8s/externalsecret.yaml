# Secrets are synced from AWS Secrets Manager by External Secrets Operator.
# Nothing sensitive lives in git; these are references only (placeholders).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vaultgate-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: vaultgate-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef: { key: vaultgate/prod/database, property: url }
    - secretKey: redis-url
      remoteRef: { key: vaultgate/prod/redis, property: url }
    - secretKey: metrics-token
      remoteRef: { key: vaultgate/prod/metrics, property: token }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vaultgate-jwt-keys
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: vaultgate-jwt-keys
  dataFrom:
    # Each property becomes a file "<kid>.pem" - add a new kid to rotate.
    - extract: { key: vaultgate/prod/jwt-signing-keys }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vaultgate-master-keys
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: vaultgate-master-keys
  data:
    - secretKey: master-keys.json
      remoteRef: { key: vaultgate/prod/master-keys }
