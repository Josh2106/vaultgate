apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vaultgate-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vaultgate-api
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vaultgate-api
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vaultgate
      app.kubernetes.io/component: api
