apiVersion: v1
kind: Service
metadata:
  name: vaultgate-api
  labels:
    app.kubernetes.io/name: vaultgate
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vaultgate
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaultgate-api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 256k
    nginx.ingress.kubernetes.io/limit-rps: "50"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.vaultgate.example.com]
      secretName: vaultgate-api-tls
  rules:
    - host: api.vaultgate.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vaultgate-api
                port:
                  name: http
---
# Default-deny for the namespace, then allow only what the API needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vaultgate-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vaultgate
      app.kubernetes.io/component: api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: 8000
          protocol: TCP
  egress:
    - to:  # DNS
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:  # Managed Postgres / Redis live in private VPC subnets
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - { port: 5432, protocol: TCP }
        - { port: 6379, protocol: TCP }
    - to:  # OTLP traces
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - { port: 4318, protocol: TCP }
