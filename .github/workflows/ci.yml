name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: Tests (SQLite + in-memory backends)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: pytest -n auto --cov=app --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  test-postgres:
    name: Tests (Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_DB: vaultgate
          POSTGRES_USER: vaultgate
          POSTGRES_PASSWORD: vaultgate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vaultgate" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      VG_DATABASE_URL: postgresql+asyncpg://vaultgate:vaultgate@localhost:5432/vaultgate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - name: Apply migrations to a real Postgres
        run: alembic upgrade head && alembic check && alembic downgrade base

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit --require-hashes --disable-pip -r requirements.lock

  docker:
    name: Build & scan image
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vaultgate:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image
        run: |
          docker run -d --name vg -p 8000:8000 \
            -e VG_ENVIRONMENT=development -e VG_JWT_KEYS_DIR=/tmp/jwt \
            -e VG_MASTER_KEY_FILE=/tmp/mk.json -e VG_DATABASE_URL=sqlite+aiosqlite:////tmp/vg.db \
            vaultgate:${{ github.sha }}
          for i in $(seq 1 20); do curl -fs localhost:8000/healthz && break; sleep 1; done
          docker logs vg
      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y trivy
          trivy --version
      - name: Trivy scan (SARIF report)
        run: trivy image --format sarif --output trivy.sarif --severity CRITICAL,HIGH --ignore-unfixed vaultgate:${{ github.sha }}
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
      - name: Trivy gate (fail on CRITICAL)
        run: trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed vaultgate:${{ github.sha }}

  manifests:
    name: Validate YAML manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -ignore-missing-schemas -summary k8s/*.yaml
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false && terraform -chdir=terraform validate
