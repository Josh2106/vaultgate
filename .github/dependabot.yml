version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      opentelemetry:
        patterns: ["opentelemetry-*"]
      dev-tools:
        patterns: ["pytest*", "ruff", "mypy", "hypothesis", "fakeredis", "pre-commit"]
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: monthly
